name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Build at the site root and run QA (links, images, H1, JSON-LD, meta lengths).
      - run: npm run build
      - run: npm run check

      # 2. Build the version that gets published.
      #    Custom domain (www.yiqimedicalgroup.com): leave the repo variable PAGES_BASE_PATH unset.
      #    Preview at https://<user>.github.io/<repo>/: set PAGES_BASE_PATH to /<repo> (Settings -> Variables).
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
